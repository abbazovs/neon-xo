<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Original vs Update — video solishtirish</title>
<style>
  :root { --accent: #ffffff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0b0b0e; color: #e8e8ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;
  }
  h1 { font-size: 15px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: #9a9aa3; margin: 0; }
  .stage {
    position: relative; width: min(1280px, 100%); aspect-ratio: 16/9; background: #000;
    border-radius: 10px; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    cursor: ew-resize;
  }
  .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  #vNew { clip-path: inset(0 0 0 50%); }
  .divider {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--accent);
    transform: translateX(-1px); pointer-events: none; box-shadow: 0 0 12px rgba(0,0,0,.8);
  }
  .handle {
    position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent); transform: translate(-50%,-50%); display: grid; place-items: center;
    box-shadow: 0 4px 18px rgba(0,0,0,.6); pointer-events: none;
  }
  .handle svg { width: 22px; height: 22px; fill: none; stroke: #111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .label {
    position: absolute; top: 14px; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); pointer-events: none;
  }
  .label.old { left: 14px; }
  .label.new { right: 14px; }
  .controls { display: flex; align-items: center; gap: 14px; width: min(1280px, 100%); }
  button {
    background: #1c1c22; color: #fff; border: 1px solid #2c2c34; border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #26262e; }
  input[type=range] { flex: 1; accent-color: #fff; }
  .time { font-variant-numeric: tabular-nums; font-size: 13px; color: #9a9aa3; min-width: 90px; text-align: right; }
  .hint { font-size: 12px; color: #6f6f78; }
</style>
</head>
<body>
  <h1>Original &nbsp;·&nbsp; Update</h1>

  <div class="stage" id="stage">
    <video id="vOld" src="original.mp4" preload="auto" playsinline muted loop></video>
    <video id="vNew" src="update.mp4" preload="auto" playsinline loop></video>
    <div class="divider" id="divider"></div>
    <div class="handle" id="handle">
      <svg viewBox="0 0 24 24"><path d="M9 6l-5 6 5 6M15 6l5 6-5 6"/></svg>
    </div>
    <span class="label old">Original</span>
    <span class="label new">Update</span>
  </div>

  <div class="controls">
    <button id="play">▶ Play</button>
    <button id="mute">🔊 Ovoz</button>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
  <div class="hint">Chiziqni suring (sichqoncha yoki barmoq) · Bo'sh joy = Play/Pause · ← → = 1 soniya</div>

<script>
  const vOld = document.getElementById('vOld');
  const vNew = document.getElementById('vNew');
  const stage = document.getElementById('stage');
  const divider = document.getElementById('divider');
  const handle = document.getElementById('handle');
  const playBtn = document.getElementById('play');
  const muteBtn = document.getElementById('mute');
  const seek = document.getElementById('seek');
  const timeEl = document.getElementById('time');

  // --- divider ---
  function setPos(x) {
    const r = stage.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (x - r.left) / r.width));
    const pct = (p * 100).toFixed(2) + '%';
    vNew.style.clipPath = `inset(0 0 0 ${pct})`;
    divider.style.left = pct;
    handle.style.left = pct;
  }
  let dragging = false;
  stage.addEventListener('pointerdown', e => { dragging = true; stage.setPointerCapture(e.pointerId); setPos(e.clientX); });
  stage.addEventListener('pointermove', e => { if (dragging) setPos(e.clientX); });
  stage.addEventListener('pointerup', () => dragging = false);
  stage.addEventListener('pointercancel', () => dragging = false);

  // --- sync playback ---
  const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  function syncTo(t) { vOld.currentTime = t; vNew.currentTime = t; }
  async function playBoth() {
    syncTo(vNew.currentTime);
    await Promise.all([vOld.play(), vNew.play()]).catch(()=>{});
    playBtn.textContent = '❚❚ Pause';
  }
  function pauseBoth() { vOld.pause(); vNew.pause(); playBtn.textContent = '▶ Play'; }
  function toggle() { vNew.paused ? playBoth() : pauseBoth(); }
  playBtn.addEventListener('click', toggle);
  muteBtn.addEventListener('click', () => { vNew.muted = !vNew.muted; muteBtn.textContent = vNew.muted ? '🔇 Ovoz' : '🔊 Ovoz'; });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight') syncTo(Math.min(vNew.duration, vNew.currentTime + 1));
    if (e.code === 'ArrowLeft') syncTo(Math.max(0, vNew.currentTime - 1));
  });
  let seeking = false;
  seek.addEventListener('input', () => { seeking = true; syncTo(seek.value / 1000 * vNew.duration); });
  seek.addEventListener('change', () => seeking = false);

  // drift correction loop
  vNew.addEventListener('timeupdate', () => {
    if (!seeking) seek.value = Math.round(vNew.currentTime / vNew.duration * 1000) || 0;
    timeEl.textContent = `${fmt(vNew.currentTime)} / ${fmt(vNew.duration || 0)}`;
    if (Math.abs(vOld.currentTime - vNew.currentTime) > 0.08) vOld.currentTime = vNew.currentTime;
  });
  vNew.addEventListener('loadedmetadata', () => timeEl.textContent = `0:00 / ${fmt(vNew.duration)}`);
</script>
</body>
</html>
